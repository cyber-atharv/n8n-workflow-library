services:
  flowforge-library:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowforge-n8n-library
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    volumes:
      - ./config:/app/config:ro
      - ./workflows:/app/workflows
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/web/"]
      interval: 30s
      timeout: 5s
      retries: 3
