<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlowForge Studio — Explore all workflows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b16;--s1:#0d1424;--s2:#131c33;--line:#1f2b48;--tx:#eef2ff;--mu:#8795b8;--a:#38bdf8;--b:#a78bfa;--ok:#34d399;--warn:#fbbf24;
--ease:cubic-bezier(.23,1,.32,1);--hd:Outfit,system-ui,sans-serif;--sans:Inter,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f6fd;--s1:#fff;--s2:#eef1fb;--line:#dbe1f3;--tx:#0e1530;--mu:#5d6a8d;--a:#0284c7;--b:#7c3aed}}
:root[data-theme="light"]{--bg:#f4f6fd;--s1:#fff;--s2:#eef1fb;--line:#dbe1f3;--tx:#0e1530;--mu:#5d6a8d;--a:#0284c7;--b:#7c3aed}
:root[data-theme="dark"]{--bg:#070b16;--s1:#0d1424;--s2:#131c33;--line:#1f2b48;--tx:#eef2ff;--mu:#8795b8;--a:#38bdf8;--b:#a78bfa}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:dark light}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:400 15px/1.55 var(--sans);overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.mono{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.grad{background:linear-gradient(100deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
nav{position:fixed;inset:0 0 auto;z-index:30;padding-top:env(safe-area-inset-top,0px);backdrop-filter:blur(16px);background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid var(--line)}
nav div{max-width:1280px;margin:auto;padding:0 20px;height:58px;display:flex;align-items:center;justify-content:space-between}
.brand{font:700 18px var(--hd);display:flex;gap:10px;align-items:center}
.brand i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 0 24px color-mix(in srgb,var(--a) 60%,transparent)}
.btn{display:inline-flex;gap:8px;align-items:center;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--s1);cursor:pointer;font-weight:500;text-decoration:none;color:var(--tx);transition:transform .16s var(--ease),border-color .2s}
.btn:hover{border-color:var(--a)}.btn:active{transform:scale(.97)}
.btn.p{background:linear-gradient(100deg,var(--a),var(--b));border:0;color:#04101f;font-weight:600}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.hero{position:relative;min-height:100vh;display:grid;place-items:center;text-align:center;padding:100px 20px 60px;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;will-change:transform}
.o1{width:480px;height:480px;background:var(--a);left:-120px;top:10%}.o2{width:520px;height:520px;background:var(--b);right:-140px;top:30%}
.floor{position:absolute;left:-20%;right:-20%;bottom:-10%;height:62%;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;transform:perspective(520px) rotateX(64deg);transform-origin:50% 100%;animation:fl 3s linear infinite;mask-image:linear-gradient(to top,#000 30%,transparent);-webkit-mask-image:linear-gradient(to top,#000 30%,transparent)}
@keyframes fl{to{background-position:0 64px}}
.hero>div{position:relative;z-index:2;max-width:860px;width:100%}
h1{font:800 clamp(42px,8vw,96px)/.98 var(--hd);letter-spacing:-.04em;margin:16px 0 18px;text-wrap:balance}
.sub{color:var(--mu);font-size:18px;max-width:52ch;margin:0 auto 30px}
.sb{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--s1) 85%,transparent);border:1px solid var(--line);border-radius:16px;padding:6px 10px 6px 18px;backdrop-filter:blur(10px);box-shadow:0 20px 60px -20px color-mix(in srgb,var(--a) 50%,transparent);transition:border-color .2s}
.sb:focus-within{border-color:var(--a)}
.sb input{flex:1;background:none;border:0;outline:0;padding:14px 0;font-size:17px}
kbd{font:500 12px var(--mono);border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--mu)}
.stats{display:flex;justify-content:center;gap:clamp(20px,5vw,60px);margin-top:44px;flex-wrap:wrap}
.stats b{display:block;font:700 clamp(30px,5vw,48px) var(--hd);letter-spacing:-.03em}
.scroll{position:absolute;bottom:22px;left:50%;translate:-50% 0;z-index:3;animation:bob 1.8s var(--ease) infinite}
@keyframes bob{50%{transform:translateY(8px)}}
.bar{position:sticky;top:58px;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:0}
.bar>div{max-width:1280px;margin:auto;padding:12px 20px;display:flex;gap:10px;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;mask-image:linear-gradient(90deg,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent)}
.chip{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--s1);cursor:pointer;font-size:13px;color:var(--mu);transition:all .2s var(--ease)}
.chip:hover{color:var(--tx)}.chip.on{background:linear-gradient(100deg,var(--a),var(--b));border-color:transparent;color:#04101f;font-weight:600}
select{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.cnt{max-width:1280px;margin:28px auto 8px;padding:0 20px;display:flex;justify-content:space-between}
.grid{max-width:1280px;margin:auto;padding:12px 20px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px;perspective:1100px}
.card{will-change:transform,opacity;transform-style:preserve-3d}
.ci{height:100%;display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:18px;background:linear-gradient(160deg,var(--s2),var(--s1));border:1px solid var(--line);cursor:pointer;position:relative;overflow:hidden;transition:border-color .25s,transform .2s var(--ease);text-align:left;width:100%}
.ci::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,hsl(var(--h) 90% 62%),transparent)}
.ci:hover{border-color:hsl(var(--h) 80% 60%)}
.pill{align-self:flex-start;font:500 11px var(--mono);padding:3px 9px;border-radius:99px;background:hsl(var(--h) 80% 60%/.14);color:hsl(var(--h) 85% 68%)}
.ci h3{font:600 18px/1.25 var(--hd);letter-spacing:-.01em}
.ci p{color:var(--mu);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chain{display:flex;align-items:center;gap:4px;margin-top:auto;flex-wrap:wrap}
.chain span{font:500 10.5px var(--mono);padding:3px 7px;border-radius:6px;background:var(--bg);border:1px solid var(--line);color:var(--mu)}
.chain i{width:10px;height:1px;background:var(--mu)}
.meta{display:flex;justify-content:space-between;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--ok)}.dot.r{background:var(--warn)}
.star{color:var(--warn)}
.empty{grid-column:1/-1;text-align:center;padding:80px 0;color:var(--mu)}
#more{height:60px}
.mb{position:fixed;inset:0;z-index:60;background:rgba(3,6,14,.72);backdrop-filter:blur(10px);display:none;place-items:center;padding:16px}
.mb.on{display:grid}
.m{width:min(980px,100%);max-height:92vh;overflow:auto;border:1px solid var(--line);border-radius:22px;background:var(--s1);animation:pop .5s var(--ease)}
@keyframes pop{from{opacity:0;transform:perspective(900px) rotateX(14deg) translateY(30px) scale(.96)}}
.mh{padding:26px 26px 14px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.mh h2{font:700 clamp(22px,3.4vw,32px)/1.1 var(--hd);letter-spacing:-.02em;margin:8px 0}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tags span{font:500 11px var(--mono);padding:3px 9px;border:1px solid var(--line);border-radius:6px;color:var(--mu)}
.acts{display:flex;gap:8px;align-items:flex-start}
.gv{margin:8px 26px;border:1px solid var(--line);border-radius:14px;background:var(--bg);overflow-x:auto;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:20px 20px}
.gv svg{display:block;min-width:700px;width:100%}
.nd rect{fill:var(--s2);stroke:var(--line);stroke-width:1.2}.nd text{fill:var(--tx);font:500 12px var(--mono)}.nd text.t{fill:var(--mu);font-size:10px}
.nd{opacity:0;transform:translateY(10px);animation:nin .6s var(--ease) forwards}
@keyframes nin{to{opacity:1;transform:none}}
.ew{fill:none;stroke:var(--a);stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1;animation:dr .8s var(--ease) forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.mf{padding:16px 26px 26px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.mf p{color:var(--mu);font-size:14px;margin-top:6px}.mf ol{margin:8px 0 0 18px;color:var(--mu);font-size:14px;line-height:1.9}
.x{position:absolute}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;translate:-50% 20px;opacity:0;z-index:99;background:var(--s2);border:1px solid var(--a);padding:12px 18px;border-radius:12px;transition:all .4s var(--ease);pointer-events:none}
#toast.on{opacity:1;translate:-50% 0}
.glow{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(480px circle at var(--mx,50%) var(--my,30%),color-mix(in srgb,var(--a) 9%,transparent),transparent 60%)}
#top{position:fixed;top:0;left:0;height:2px;width:0;background:linear-gradient(90deg,var(--a),var(--b));z-index:99}
@media(max-width:700px){.mf{grid-template-columns:1fr}.bar select{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.nd{opacity:1}.ew{stroke-dashoffset:0}}
</style></head>
<body>
<div id="top"></div>
<nav><div><span class="brand"><i></i>FlowForge Studio</span><span style="display:flex;gap:10px;align-items:center"><span class="mono" id="src"></span><a class="btn" href="https://github.com/cyber-atharv/n8n-workflow-library" target="_blank" rel="noopener">GitHub ↗</a></span></div></nav>

<header class="hero">
  <div class="orb o1" data-p=".12"></div><div class="orb o2" data-p="-.1"></div><div class="floor"></div>
  <div>
    <span class="mono">Workflow explorer · License-audited · MIT</span>
    <h1>Explore every <span class="grad">workflow.</span></h1>
    <p class="sub">Search, inspect and import production-ready n8n automations. Scroll to fly through the library.</p>
    <label class="sb"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="q" placeholder="Search AI agent, Slack, Shopify, webhook, RAG…" autocomplete="off" aria-label="Search workflows"><kbd>/</kbd></label>
    <div class="stats"><div><b data-k="tw">0</b><span class="mono">Workflows</span></div><div><b data-k="tc">0</b><span class="mono">Categories</span></div><div><b data-k="ti">0</b><span class="mono">Integrations</span></div></div>
  </div>
  <div class="scroll mono">Scroll ↓</div>
</header>

<div class="bar" id="bar"><div><div class="chips" id="chips"></div>
<select id="cx" aria-label="Complexity"><option value="">Any complexity</option><option>Simple</option><option>Moderate</option><option>Advanced</option></select>
<select id="so" aria-label="Sort"><option value="f">Featured first</option><option value="a">A–Z</option><option value="n">Most nodes</option></select></div></div>
<div class="cnt"><span class="mono" id="rc"></span><span class="mono">Click a card for the node graph</span></div>
<main class="grid" id="grid"></main><div id="more"></div>

<div class="mb" id="mb" role="dialog" aria-modal="true"><div class="m" id="m"></div></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
const CATS=["AI Agents & LLMs","OpenAI & AI Integrations","Databases & SQL","Email & Gmail","Slack & Messaging","E-commerce","CRM & Sales","Google Workspace","Webhooks & APIs","RSS & News Monitoring"];
let W=[],ST=null,cat="",cx="",q="",so="f",list=[],shown=0;
const PAGE=18;
// ---- demo fallback (used only if data/index.json can't be fetched) ----
function demo(){const V=["Autonomous","Smart","Automated","Realtime","Scheduled","AI-Powered"],O=["Lead Enrichment","Invoice Parser","Support Triage","Content Repurposer","Order Alerts","Data Sync","Report Builder","Slack Digest","Sentiment Monitor"],I=["OpenAI","Slack","HubSpot","Gmail","Google Sheets","Shopify","Notion","Telegram","Airtable","Postgres","Discord","HTTP Request"],T=["Webhook","Schedule","Manual"];
return Array.from({length:60},(_,i)=>{const n=3+(i*7)%14,ints=[I[i%12],I[(i*5+3)%12],I[(i*7+1)%12]].filter((x,k,a)=>a.indexOf(x)==k),tr=T[i%3],c=CATS[i%10];
const lab=[tr,...Array.from({length:Math.min(n,8)-1},(_,k)=>ints[k%ints.length])];
return{id:"d"+i,title:`${V[i%6]} ${O[i%9]}${i>=18?" v"+(1+(i/18|0)):""}`,category_name:c,category_id:c,node_count:n,complexity:n<6?"Simple":n<16?"Moderate":"Advanced",integrations:ints,triggers:[tr],has_credentials:i%3>0,description:`Production-ready ${O[i%9].toLowerCase()} flow using ${ints.join(", ")}. Trigger: ${tr}.`,is_original:i<4,license:"MIT",risk_level:i%4?"SAFE":"REVIEW",maintainer:"Atharv Hogade (cyber-atharv)",catalog_rel_path:"",nodes_summary:lab.map((l,k)=>({name:l+" "+(k+1),label:l,type:"n8n-nodes-base."+l.toLowerCase().replace(/\W/g,"")}))}})}
async function load(){let src="live data";try{const r=await fetch("data/index.json");if(!r.ok)throw 0;W=await r.json();try{ST=await (await fetch("data/stats.json")).json()}catch{}}catch{W=demo();src="demo data"}
$("#src").textContent=src;
const cats=[...new Set(W.map(w=>w.category_name))].sort();
const ti=ST?.integrations?.length||new Set(W.flatMap(w=>w.integrations)).size;
const tgt={tw:ST?.total_workflows||W.length,tc:ST?.total_categories||cats.length,ti};
document.querySelectorAll("[data-k]").forEach(e=>count(e,tgt[e.dataset.k]));
$("#chips").innerHTML=`<button class="chip on" data-c="">All</button>`+cats.map(c=>`<button class="chip" data-c="${c.replace(/"/g,"&quot;")}">${c}</button>`).join("");
apply()}
function count(e,t){const s=performance.now();(function f(n){const k=Math.min(1,(n-s)/1600);e.textContent=Math.round(t*(1-(1-k)**4)).toLocaleString();if(k<1)requestAnimationFrame(f)})(s)}
function apply(){const s=q.toLowerCase().trim();
list=W.filter(w=>(!cat||w.category_name===cat)&&(!cx||w.complexity===cx)&&(!s||w.title.toLowerCase().includes(s)||(w.description||"").toLowerCase().includes(s)||w.integrations.some(i=>i.toLowerCase().includes(s))));
if(so=="a")list.sort((a,b)=>a.title.localeCompare(b.title));else if(so=="n")list.sort((a,b)=>b.node_count-a.node_count);else list.sort((a,b)=>(b.is_original|0)-(a.is_original|0));
$("#rc").textContent=`${list.length.toLocaleString()} workflows`;$("#grid").innerHTML="";shown=0;more();
if(!list.length)$("#grid").innerHTML=`<div class="empty">No workflows match. Try another search.</div>`}
const hue=n=>190+([...n].reduce((a,c)=>a+c.charCodeAt(0),0)*7)%110;
function more(){const g=$("#grid"),f=document.createDocumentFragment();list.slice(shown,shown+PAGE).forEach((w,j)=>{const c=document.createElement("div");c.className="card";
const ch=(w.nodes_summary||[]).slice(0,4).map(n=>`<span>${n.label}</span>`).join("<i></i>");
c.innerHTML=`<button class="ci" style="--h:${hue(w.category_name)}"><span class="pill">${w.category_name}</span><h3>${w.is_original?'<span class="star">★</span> ':""}${w.title}</h3><p>${w.description||""}</p><div class="chain">${ch}${w.node_count>4?`<i></i><span>+${w.node_count-4}</span>`:""}</div><div class="meta mono"><span>${w.node_count} nodes · ${w.complexity}</span><span><span class="dot ${w.risk_level=="SAFE"?"":"r"}"></span>${w.risk_level||""}</span></div></button>`;
const ci=c.firstChild;ci.onclick=()=>open(w);
if(!reduce&&matchMedia("(hover:hover)").matches){ci.onpointermove=e=>{const r=ci.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;ci.style.transform=`rotateY(${x*10}deg) rotateX(${-y*10}deg) translateZ(10px)`};ci.onpointerleave=()=>ci.style.transform=""}
f.append(c)});g.append(f);shown+=PAGE;tick()}
// ---- 3D scroll: cards tilt & recede relative to viewport centre ----
let tk=false;function tick(){if(!tk){tk=true;requestAnimationFrame(frame)}}
function frame(){tk=false;const h=innerHeight;
$("#top").style.width=scrollY/(document.body.scrollHeight-h)*100+"%";
document.querySelectorAll(".orb").forEach(o=>o.style.transform=`translateY(${scrollY*o.dataset.p}px)`);
if(reduce)return;
document.querySelectorAll(".card").forEach(c=>{const r=c.getBoundingClientRect();if(r.bottom<-200||r.top>h+200){return}
const d=Math.max(-1,Math.min(1,(r.top+r.height/2-h/2)/(h/2)));
c.style.transform=`rotateX(${d*16}deg) translateZ(${-Math.abs(d)*90}px) scale(${1-Math.abs(d)*.04})`;c.style.opacity=1-Math.max(0,Math.abs(d)-.55)*.9})}
addEventListener("scroll",tick,{passive:true});addEventListener("resize",tick);
new IntersectionObserver(e=>{if(e[0].isIntersecting&&shown<list.length)more()},{rootMargin:"400px"}).observe($("#more"));
// ---- modal ----
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function graph(ns){ns=ns.slice(0,8);const X=i=>30+170*(i%4),Y=i=>30+100*(i/4|0),rows=Math.ceil(ns.length/4);let s=`<svg viewBox="0 0 720 ${rows*100+40}">`;
for(let i=0;i<ns.length-1;i++){const x1=X(i)+130,y1=Y(i)+25,x2=X(i+1),y2=Y(i+1)+25,dx=Math.abs(x2-x1)*.5||40;
s+=`<path class="ew" pathLength="1" style="animation-delay:${i*.15+.2}s" d="M${x1} ${y1} C ${x1+dx} ${y1},${x2-dx} ${y2},${x2} ${y2}"/>`}
ns.forEach((n,i)=>s+=`<g class="nd" style="animation-delay:${i*.12}s"><rect x="${X(i)}" y="${Y(i)}" width="130" height="50" rx="11"/><text x="${X(i)+12}" y="${Y(i)+22}">${esc(n.label||"")}</text><text class="t" x="${X(i)+12}" y="${Y(i)+38}">${esc((n.name||"").slice(0,18))}</text></g>`);
return s+"</svg>"}
let cur=null;
function open(w){cur=w;$("#m").innerHTML=`<div class="mh"><div><span class="pill" style="--h:${hue(w.category_name)};display:inline-block;font:500 11px var(--mono);padding:3px 9px;border-radius:99px;background:hsl(${hue(w.category_name)} 80% 60%/.14);color:hsl(${hue(w.category_name)} 85% 68%)">${esc(w.category_name)}</span><h2>${esc(w.title)}</h2><div class="tags"><span>${w.node_count} nodes</span><span>${esc(w.complexity)}</span><span>${esc(w.license||"MIT")}</span><span>${esc(w.risk_level||"")}</span><span>${esc(w.maintainer||"")}</span></div></div>
<div class="acts"><button class="btn p" id="cp">Copy workflow</button><button class="btn" id="dl">Download</button><button class="btn" id="cl" aria-label="Close">✕</button></div></div>
<div class="gv">${graph(w.nodes_summary||[])}</div>
<div class="mf"><div><span class="mono">About</span><p>${esc(w.description||"")}</p><p style="margin-top:12px"><span class="mono">Integrations</span><br>${esc(w.integrations.join(" · "))}</p><p><span class="mono">Triggers</span><br>${esc((w.triggers||[]).join(" · "))}${w.has_credentials?" · credentials required":" · no credentials"}</p></div>
<div><span class="mono">10-second import</span><ol><li>Click Copy workflow</li><li>Open your n8n canvas</li><li>Press Ctrl/Cmd + V</li><li>Attach credentials, test, activate</li></ol></div></div>`;
$("#mb").classList.add("on");document.body.style.overflow="hidden";
$("#cl").onclick=close;$("#cp").onclick=async()=>{const t=JSON.stringify(await wf(w),null,2);try{await navigator.clipboard.writeText(t);toast("Copied. Open n8n and press Ctrl+V")}catch{toast("Clipboard blocked — use Download")}};
$("#dl").onclick=async()=>{const b=new Blob([JSON.stringify(await wf(w),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=(w.title||"workflow")+".json";a.click()}}
async function wf(w){if(w.catalog_rel_path){try{const r=await fetch("../"+w.catalog_rel_path);if(r.ok)return await r.json()}catch{}}
const ns=w.nodes_summary||[];return{name:w.title,nodes:ns.map((n,i)=>({id:String(i+1),name:n.name,type:n.type||"n8n-nodes-base.noOp",typeVersion:1,position:[200+i*250,300],parameters:{}})),connections:Object.fromEntries(ns.slice(0,-1).map((n,i)=>[n.name,{main:[[{node:ns[i+1].name,type:"main",index:0}]]}])),description:w.description}}
function close(){$("#mb").classList.remove("on");document.body.style.overflow=""}
$("#mb").onclick=e=>{if(e.target.id=="mb")close()};
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2600)}
// ---- controls ----
$("#q").oninput=e=>{q=e.target.value;apply()};
$("#chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===b));cat=b.dataset.c;apply()};
$("#cx").onchange=e=>{cx=e.target.value;apply()};$("#so").onchange=e=>{so=e.target.value;apply()};
addEventListener("keydown",e=>{if(e.key=="Escape")close();if(e.key=="/"&&document.activeElement.tagName!="INPUT"){e.preventDefault();$("#q").focus();scrollTo({top:0,behavior:"smooth"})}});
const gl=document.createElement("div");gl.className="glow";document.body.append(gl);
addEventListener("pointermove",e=>{gl.style.setProperty("--mx",e.clientX+"px");gl.style.setProperty("--my",e.clientY+"px")},{passive:true});
load();
</script></body></html>
