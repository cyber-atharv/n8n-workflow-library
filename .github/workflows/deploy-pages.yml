name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        run: |
          mkdir -p _site
          # Copy web application assets to root of Pages
          cp -r web/* _site/
          # Also preserve /web/ subdirectory so both paths work
          mkdir -p _site/web
          cp -r web/* _site/web/
          # Copy workflows into the site build so all JSON files are accessible
          cp -r workflows _site/
          # Ensure Jekyll processing is disabled
          touch _site/.nojekyll
          touch _site/web/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
